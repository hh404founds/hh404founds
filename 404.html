<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - Səhifə Tapılmadı</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: linear-gradient(135deg, #1e1b4b, #312e81, #0f172a);
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        .container {
            text-align: center;
            padding: 2rem;
            max-width: 650px;
        }

        /* Balon şrift effekti (Puffy / Bubble text style) */
        .bubble-text {
            font-size: 8rem;
            font-weight: 900;
            letter-spacing: 5px;
            color: #ffffff;
            text-shadow: 
                0 1px 0 #ccc,
                0 2px 0 #c9c9c9,
                0 3px 0 #bbb,
                0 4px 0 #b9b9b9,
                0 5px 0 #aaa,
                0 6px 1px rgba(0,0,0,.1),
                0 0 5px rgba(0,0,0,.1),
                0 1px 3px rgba(0,0,0,.3),
                0 3px 5px rgba(0,0,0,.2),
                0 5px 10px rgba(0,0,0,.25),
                0 10px 10px rgba(0,0,0,.2),
                0 20px 20px rgba(0,0,0,0.15),
                0 0 30px #ec4899,
                0 0 60px #8b5cf6;
            margin-bottom: 1.5rem;
            animation: float 3s ease-in-out infinite;
        }

        .hosting-msg {
            font-size: 1.3rem;
            color: #cbd5e1;
            margin-bottom: 2rem;
            font-weight: 500;
            letter-spacing: 0.5px;
            background: rgba(255, 255, 255, 0.05);
            padding: 1rem 1.5rem;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.2);
        }

        .btn {
            display: inline-block;
            background: linear-gradient(135deg, #ec4899, #8b5cf6);
            color: white;
            padding: 0.8rem 2.2rem;
            font-size: 1rem;
            font-weight: 600;
            text-decoration: none;
            border-radius: 50px;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(236, 72, 153, 0.4);
        }

        .btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 6px 25px rgba(236, 72, 153, 0.6);
        }

        @keyframes float {
            0%, 100% { transform: translateY(0) scale(1); }
            50% { transform: translateY(-12px) scale(1.02); }
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Balon dizaynlı 404 -->
        <div class="bubble-text">404</div>
        
        <!-- İstədiyin yazı -->
        <div class="hosting-msg">
            H&H hostinqinde böyle bir site bulunmamakta.
        </div>

        <a href="/" class="btn">Ana Səhifəyə Qayıt</a>
    </div>

</body>
</html>
